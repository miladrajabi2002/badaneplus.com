# BadanePlus — badaneplus.com (نسخه ۳: Next.js استاتیک + سرور Node.js + PM2)
# nginx از پوشه live/ سرو می‌کند؛ /t و /api/ به Node پراکسی می‌شوند
log_format visit '$msec|$remote_addr|$status|$arg_p|$http_x_forwarded_for|$http_user_agent';

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name badaneplus.com;

    # تمدید certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name badaneplus.com;

    root /var/www/badaneplus.com/live;
    index index.html;

    # SSL (certbot)
    ssl_certificate     /etc/letsencrypt/live/badaneplus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/badaneplus.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    charset utf-8;
    client_max_body_size 8m;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    access_log /var/log/nginx/badaneplus.com.access.log;
    error_log  /var/log/nginx/badaneplus.com.error.log;

    # --- بیکون آمار → سرور Node (ثبت در SQLite) ---
    location = /t {
        access_log /var/log/nginx/badaneplus-visit.log visit;
        add_header Cache-Control "no-store, no-cache" always;
        add_header Access-Control-Allow-Origin "https://badaneplus.com" always;
        include /var/www/badaneplus.com/deploy/security-headers.conf;
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- API سرور Node ---
    location /api/ {
        include /var/www/badaneplus.com/deploy/security-headers.conf;
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        image/svg+xml font/woff2;

    # --- استاتیک Next.js (هش‌شده — کش یک‌ساله) ---
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /var/www/badaneplus.com/deploy/security-headers.conf;
        try_files $uri =404;
    }

    # --- استت‌های عمومی (عکس/فونت) — کش یک‌ماهه ---
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000";
        include /var/www/badaneplus.com/deploy/security-headers.conf;
        try_files $uri =404;
    }

    # --- آیکون‌ها / manifest / sw ---
    location ~* ^/(favicon\.(svg|png)|apple-touch-icon\.png|icon-(192|512)\.png|manifest\.webmanifest|sw\.js)$ {
        add_header Cache-Control "public, max-age=604800";
        include /var/www/badaneplus.com/deploy/security-headers.conf;
        try_files $uri =404;
    }

    # --- sitemap و robots ---
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; include /var/www/badaneplus.com/deploy/security-headers.conf; }
    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; include /var/www/badaneplus.com/deploy/security-headers.conf; }

    # --- داده‌های JSON هرگز از روت وب سرو نشوند (به‌جز باندل‌های Next) ---
    location ~* ^(?!/_next/).*\.(json)$ {
        deny all;
        return 404;
    }

    # --- صفحات: کش کوتاه تا تغییرات ربات سریع دیده شود ---
    location / {
        add_header Cache-Control "public, max-age=300";
        include /var/www/badaneplus.com/deploy/security-headers.conf;
        try_files $uri $uri/ $uri.html =404;
    }

    # ۴۰۴ اختصاصی
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # رد فایل‌های مخفی
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
