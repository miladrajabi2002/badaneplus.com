# BadanePlus — badaneplus.com nginx configuration
# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name badaneplus.com;

    # certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name badaneplus.com;

    root /var/www/badaneplus.com/site;
    index index.html;

    # SSL (managed by certbot placeholders — filled on first cert)
    ssl_certificate     /etc/letsencrypt/live/badaneplus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/badaneplus.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    charset utf-8;
    client_max_body_size 8m;

    # HSTS at server level
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    access_log /var/log/nginx/badaneplus.com.access.log;
    error_log  /var/log/nginx/badaneplus.com.error.log;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        image/svg+xml font/woff2;

    # --- static assets: long cache ---
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000";
        include /var/www/badaneplus.com/deploy/security-headers.conf;
        try_files $uri =404;
    }

    # --- icons / manifest ---
    location ~* ^/(favicon\.(svg|png)|apple-touch-icon\.png|icon-(192|512)\.png|manifest\.webmanifest|sw\.js)$ {
        add_header Cache-Control "public, max-age=604800";
        include /var/www/badaneplus.com/deploy/security-headers.conf;
        try_files $uri =404;
    }

    # --- sitemap & robots ---
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; include /var/www/badaneplus.com/deploy/security-headers.conf; }
    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; include /var/www/badaneplus.com/deploy/security-headers.conf; }

    # --- JSON data must never be exposed from web root (it is outside site/ anyway) ---
    location ~* \.(json)$ {
        deny all;
        return 404;
    }

    # --- pages: clean URLs, short cache so bot updates appear fast ---
    location / {
        add_header Cache-Control "public, max-age=300";
        include /var/www/badaneplus.com/deploy/security-headers.conf;
        try_files $uri $uri/ $uri.html =404;
    }

    # custom 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # deny dotfiles
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
